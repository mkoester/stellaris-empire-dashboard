# A version tag builds the player zips and publishes them as a GitHub release (RELEASE.md), by branch:
#   main       `vX.Y.Z`         "Stellaris Empire Dashboard X.Y.Z", notes: CHANGELOG's X.Y.Z section
#   develop    `vX.Y.Z-rc.N`    "… X.Y.Z rc-N", a prerelease (release candidate), notes: Unreleased
#   open-beta  `vX.Y.Z-beta.N`  "… X.Y.Z vN (for Open Beta <openBeta>)", a prerelease for a game's
#                               open beta (package.json's `openBeta`, e.g. 4.5.3), notes: Unreleased
# Any other tag, or one off its branch, fails early.
name: Release

on:
  push:
    tags:
      [
        'v[0-9]+.[0-9]+.[0-9]+',
        'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+',
        'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
      ]

permissions:
  contents: write # create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # package.mjs finds the extractor as a sibling folder, as in the workspace
      - uses: actions/checkout@v7
        with:
          path: stellaris-empire-dashboard
          fetch-depth: 0 # main, to check the tag is on it

      - name: Check the tag is on its branch (main, develop, open-beta) and matches package.json
        working-directory: stellaris-empire-dashboard
        run: |
          version=$(node -p "require('./package.json').version")
          n=${GITHUB_REF_NAME##*.}
          title="Stellaris Empire Dashboard $version"
          case "$GITHUB_REF_NAME" in
            *-rc.*) branch=develop; expected="v$version-rc.$n"; title="$title rc-$n" ;;
            *-beta.*)
              branch=open-beta; expected="v$version-beta.$n"
              beta=$(node -p "require('./package.json').openBeta ?? ''")
              [ -n "$beta" ] || { echo "::error::a beta build needs package.json's openBeta (the game's beta version, e.g. 4.5.3)"; exit 1; }
              echo "OPEN_BETA=$beta" >> "$GITHUB_ENV"
              title="$title v$n (for Open Beta $beta)" ;;
            *) branch=main; expected="v$version" ;;
          esac
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch" ||
            { echo "::error::$GITHUB_REF_NAME is not on $branch"; exit 1; }
          [ "$GITHUB_REF_NAME" = "$expected" ] ||
            { echo "::error::tag $GITHUB_REF_NAME, but package.json says $version"; exit 1; }
          [ "$branch" = main ] || echo "PRERELEASE=1" >> "$GITHUB_ENV"
          echo "TITLE=$title" >> "$GITHUB_ENV"
          echo "EXTRACTOR=$(node -p "require('./package.json').extractorVersion")" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          repository: mkoester/stellaris-data-extraction
          ref: ${{ env.EXTRACTOR }}
          path: stellaris-data-extraction
          fetch-tags: true # package.mjs checks the pinned tag is HEAD's

      # A regular release pins a regular extractor release, and that one's dump must be its own
      # code's output from the public game — not stale, not a beta's (extraction's RELEASE.md).
      - name: Check the extractor's dump is fresh and from the public game
        if: env.PRERELEASE != '1'
        working-directory: stellaris-data-extraction
        run: scripts/release-check

      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version-file: stellaris-empire-dashboard/.node-version

      - name: Install, check, test
        working-directory: stellaris-empire-dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm test

      - name: Package
        working-directory: stellaris-empire-dashboard
        run: node scripts/package.mjs

      - name: Publish the release
        working-directory: stellaris-empire-dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # this version's CHANGELOG section (a prerelease's: Unreleased), without its heading
          section=$([ -n "$PRERELEASE" ] && echo Unreleased || echo "${GITHUB_REF_NAME#v}")
          awk -v v="$section" '/^## \[/ { on = index($0, "## [" v "]") == 1; next } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no '## [$section]' section in CHANGELOG.md"; exit 1; }
          # the game it was built for: a beta's from package.json, else the bundled extractor's dump
          # (release-check holds that one to the public game's data)
          game=$(scripts/game-version.sh ../stellaris-data-extraction/sql/stellaris.sql "$OPEN_BETA")
          { printf '**Built for %s.**\n\n' "$game"; cat notes.md; } > release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag ${PRERELEASE:+--prerelease} \
            --title "$TITLE" --notes-file release-notes.md
