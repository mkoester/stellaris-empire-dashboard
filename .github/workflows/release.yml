# A version tag on main (`vX.Y.Z`, RELEASE.md) builds the player zips and publishes them as a
# GitHub release, its notes taken from CHANGELOG.md. Any other tag, or one off main, fails early.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write # create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # package.mjs finds the extractor as a sibling folder, as in the workspace
      - uses: actions/checkout@v7
        with:
          path: stellaris-empire-dashboard
          fetch-depth: 0 # main, to check the tag is on it

      - name: Check the tag is a release on main that matches package.json
        working-directory: stellaris-empire-dashboard
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          version=$(node -p "require('./package.json').version")
          [ "$GITHUB_REF_NAME" = "v$version" ] ||
            { echo "::error::tag $GITHUB_REF_NAME, but package.json says $version"; exit 1; }
          echo "EXTRACTOR=$(node -p "require('./package.json').extractorVersion")" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          repository: mkoester/stellaris-data-extraction
          ref: ${{ env.EXTRACTOR }}
          path: stellaris-data-extraction
          fetch-tags: true # package.mjs checks the pinned tag is HEAD's

      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version-file: stellaris-empire-dashboard/.node-version

      - name: Install, check, test
        working-directory: stellaris-empire-dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm test

      - name: Package
        working-directory: stellaris-empire-dashboard
        run: node scripts/package.mjs

      - name: Publish the release
        working-directory: stellaris-empire-dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # this version's CHANGELOG section, without its heading
          awk -v v="$version" '/^## \[/ { on = index($0, "## [" v "]") == 1; next } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no '## [$version]' section in CHANGELOG.md"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag \
            --title "Stellaris Empire Dashboard $version" --notes-file notes.md
