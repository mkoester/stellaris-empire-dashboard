# A version tag on main (`vX.Y.Z`, RELEASE.md) builds the player zips and publishes them as a
# GitHub release, its notes taken from CHANGELOG.md. A beta tag on open-beta (`vX.Y.Z-beta.N`, for a
# game's open beta) publishes them as a prerelease, its notes CHANGELOG's Unreleased section. Any
# other tag, or one off its branch, fails early.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+']

permissions:
  contents: write # create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # package.mjs finds the extractor as a sibling folder, as in the workspace
      - uses: actions/checkout@v7
        with:
          path: stellaris-empire-dashboard
          fetch-depth: 0 # main, to check the tag is on it

      - name: Check the tag is a release on main (a beta on open-beta) that matches package.json
        working-directory: stellaris-empire-dashboard
        run: |
          version=$(node -p "require('./package.json').version")
          case "$GITHUB_REF_NAME" in
            *-beta.*) branch=open-beta; expected="v$version-beta.${GITHUB_REF_NAME##*-beta.}"; echo "BETA=1" >> "$GITHUB_ENV" ;;
            *) branch=main; expected="v$version" ;;
          esac
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch" ||
            { echo "::error::$GITHUB_REF_NAME is not on $branch"; exit 1; }
          [ "$GITHUB_REF_NAME" = "$expected" ] ||
            { echo "::error::tag $GITHUB_REF_NAME, but package.json says $version"; exit 1; }
          echo "EXTRACTOR=$(node -p "require('./package.json').extractorVersion")" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          repository: mkoester/stellaris-data-extraction
          ref: ${{ env.EXTRACTOR }}
          path: stellaris-data-extraction
          fetch-tags: true # package.mjs checks the pinned tag is HEAD's

      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version-file: stellaris-empire-dashboard/.node-version

      - name: Install, check, test
        working-directory: stellaris-empire-dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm test

      - name: Package
        working-directory: stellaris-empire-dashboard
        run: node scripts/package.mjs

      - name: Publish the release
        working-directory: stellaris-empire-dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # this version's CHANGELOG section (a beta's: Unreleased), without its heading
          section=$([ -n "$BETA" ] && echo Unreleased || echo "$version")
          awk -v v="$section" '/^## \[/ { on = index($0, "## [" v "]") == 1; next } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no '## [$section]' section in CHANGELOG.md"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag ${BETA:+--prerelease} \
            --title "Stellaris Empire Dashboard $version" --notes-file notes.md
